name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install ".[test]"
      - name: Test (no network)
        run: pytest -q
      - name: Smoke-run the CLI on the fixture
        run: |
          auction-tape --from-file tests/fixtures/auctions.json --approx-wi --closes-file tests/fixtures/par_curve_2026.csv -o dashboard.html
          auction-tape --from-file tests/fixtures/auctions.json --json --wi 10Y=5.31 > /dev/null
