[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "auction-tape"
version = "0.1.0"
description = "Score U.S. Treasury note and bond auctions for demand (bid-to-cover, indirect and dealer share) against their own history, and render a one-file dashboard."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yupeng Lu" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["treasury", "auctions", "bonds", "rates", "macro", "cli", "dashboard"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
auction-tape = "auction_tape.cli:main"

[project.urls]
Homepage = "https://github.com/BrickerP/auction-tape"

[tool.hatch.build.targets.wheel]
packages = ["src/auction_tape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
